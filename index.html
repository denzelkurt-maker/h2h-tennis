<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050608">
<title>H2H Tennis</title>
<style>
/* Layout : une colonne, bandeau fixe en haut (titre + onglets segmentés), contenu en cartes groupées façon iOS,
   carte de duel scindée bleu/orange. Thème unique bleu nuit (bleu de table de ping). */
:root{
  /* Thème noir et bleu : fond noir, cartes gris bleuté, accent bleu ; orange réservé au joueur B */
  --bg:#050608; --surface:#0F141B; --sunk:#18202B; --line:#242E3C;
  --ink:#EEF3F8; --muted:#8E9BAD; --ball:#F7F7F2;
  --acc:#4C9BFF; --acc-fill:#1F6FEB; --on-acc:#FFFFFF; --acc-glow:rgba(31,111,235,.45);
  --a:#6FB2FF; --a-fill:#2B74D8; --b:#FFA45C; --b-fill:#E06B1F; --on-b:#2A1606;
  --gold:#F2C14E; --silver:#C9D3DD; --bronze:#D9935A; --on-medal:#1B1405;
  --win-bg:#D7F1DF; --win-ink:#123620; --win-mut:#3E6A4E; --win-txt:#17733D;
  --loss-bg:#F8DDD8; --loss-ink:#4A1712; --loss-mut:#7A4740; --loss-txt:#B12A1C;
  --sel:#0B1B30; --sel-line:rgba(76,155,255,.6);
  --wood:#D2A26A; --win:#5BD58F; --loss:#FF8B7B; --warn:#FFD27A; --warn-bg:#2A2410;
  --f:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
html{height:100%;box-sizing:border-box}
body{height:100%;display:flex;flex-direction:column;overflow:hidden;font-family:var(--f);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.topbar{flex:none;background:var(--bg);z-index:5}
.topin{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:10px;border-bottom:1px solid var(--line)}
.scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
header.top{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:10px 10px;text-align:center}
.help-btn{position:absolute;right:0;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink);font-weight:800;text-decoration:none;font-size:.95rem}
h1{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:clamp(1.05rem,5.2vw,1.45rem);letter-spacing:-.01em;margin:0;line-height:1.1;white-space:nowrap}
h1 .ttl span{color:var(--acc)}
.logo{width:2.1rem;height:1.75rem;flex:none}
.logo .bladeA{fill:var(--a-fill)} .logo .bladeB{fill:var(--b-fill)}
.logo .rim{fill:none;stroke:var(--ball);stroke-opacity:.35;stroke-width:1}
.logo .hdl{fill:var(--wood)}
.logo .ball{fill:var(--ball);stroke:var(--bg);stroke-width:1}
.sync{font-size:.75rem;color:var(--muted);text-align:center}
h2{font-weight:700;font-size:1.15rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
section.view{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
/* Onglets : contrôle segmenté */
nav.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;background:var(--sunk);border-radius:12px;padding:3px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 0;border-radius:9px;color:var(--muted);text-decoration:none;font-size:clamp(.56rem,2.45vw,.72rem);font-weight:600;text-align:center;white-space:nowrap;min-width:0;-webkit-tap-highlight-color:transparent}
nav.tabs a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a[aria-current="page"]{background:var(--acc-fill);color:#fff;box-shadow:0 4px 14px var(--acc-glow)}
/* Sélecteurs */
.pickers{display:grid;grid-template-columns:1fr auto;gap:12px 8px;align-items:end}
.pickers .pA{grid-column:1;grid-row:1} .pickers .pB{grid-column:1;grid-row:2} .pickers .swap{grid-column:2;grid-row:1/3;align-self:center}
.pick{display:flex;flex-direction:column;gap:6px;min-width:0}
.pick .label.a{color:var(--a)} .pick .label.b{color:var(--b)}
.label .cur{color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600;font-size:.92rem;margin-left:6px}
.combo{position:relative}
.combo input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 40px 11px 12px;width:100%;min-width:0}
.combo input::placeholder{color:var(--muted)}
.combo .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:6px 10px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;margin:0;padding:4px;list-style:none;background:var(--sunk);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 28px rgba(4,14,26,.45);max-height:min(45vh,24rem);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sugg li{display:block}
.sugg .opt{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:12px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-weight:400;text-align:left;cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.sugg li+li .opt{border-top:1px solid var(--line);border-radius:0}
.sugg .opt[aria-selected="true"],.sugg .opt:hover,.sugg .opt:active{background:var(--surface);border-radius:8px}
.sugg .opt .c{color:var(--muted);font-size:.85rem;white-space:nowrap}
.sugg .opt mark{background:transparent;color:var(--acc);font-weight:700}
.sugg .none{color:var(--muted);padding:10px}
.sugg .grp{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);padding:10px 10px 4px}
.sugg .grp + li .opt{border-top:0}
/* Contrôles */
select,input[type=number],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
select{appearance:auto}
textarea{min-height:150px;font-size:16px;resize:vertical} /* 16 px : évite le zoom automatique d'iOS */
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);padding:10px 14px;cursor:pointer;touch-action:manipulation}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.swap{padding:10px 12px;font-size:1.1rem;line-height:1;border-radius:999px}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.empty b{color:var(--ink)}
/* Carte de duel scindée */
.duel{position:relative;display:grid;grid-template-columns:1fr 1fr;border-radius:18px;overflow:hidden}
.duel .half{padding:16px 14px 14px;color:#fff;display:flex;flex-direction:column;min-width:0}
.duel .ha{background:var(--a-fill)} .duel .hb{background:var(--b-fill);text-align:right;align-items:flex-end}
.duel a.dlink{color:inherit;text-decoration:none;display:flex;flex-direction:column;min-width:0;-webkit-tap-highlight-color:transparent}
.duel .hb a.dlink{align-items:flex-end}
.duel a.dlink .ln::after{content:"\00a0›";opacity:.75;font-weight:600}
.duel a.dlink:active{opacity:.7}
.duel .fn{font-size:.8rem;opacity:.85}
.duel .ln{font-size:1.05rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.duel .wins{font-size:3.2rem;font-weight:800;line-height:1;margin-top:8px;letter-spacing:-.02em}
.duel .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:var(--ball);color:var(--bg);display:grid;place-items:center;font-size:.78rem;font-weight:800;box-shadow:0 0 0 4px var(--bg)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 11px;font-size:.86rem}
.stat{display:grid;grid-template-columns:4rem minmax(0,1fr) 4rem;gap:8px;align-items:center;padding-block:4px}
.stat+.stat{border-top:1px solid var(--line);padding-top:10px}
.stat .v{font-weight:700;font-size:1.05rem}
.stat .v.a{text-align:left;color:var(--a)} .stat .v.b{text-align:right;color:var(--b)}
.stat .mid{display:flex;flex-direction:column;gap:5px;min-width:0}
.stat .mid .label{text-align:center}
button.stat.statb{width:100%;font:inherit;color:inherit;background:none;border:0;border-radius:10px;padding:4px 2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.stat.statb+.stat,.stat+button.stat.statb{border-top:1px solid var(--line);padding-top:10px}
button.stat.statb .kchev{color:var(--acc);font-weight:800;display:inline-block;transition:transform .15s}
button.stat.statb[aria-expanded="true"]{background:var(--sunk)}
button.stat.statb[aria-expanded="true"] .kchev{transform:rotate(90deg)}
.ctr{text-align:center}
.kf-sub{font-weight:800;font-size:.9rem;padding:8px 2px 2px;color:var(--ink)}
.m.mscore{grid-template-columns:1fr auto}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%} .bar .ia{background:var(--a-fill)} .bar .ib{background:var(--b-fill)}
/* Liste de matchs (cellules groupées) */
.matches{display:flex;flex-direction:column}
.m{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);align-items:center;min-width:0}
.m:first-child{border-top:0;padding-top:4px}
.m .when{grid-column:1/-1;font-size:.76rem;color:var(--muted);line-height:1.25}
.m .when br{display:none}
.m .when .sep{margin:0 4px}
.m .who{min-width:0;font-weight:600;overflow-wrap:anywhere}
.m .res{font-weight:800;font-size:1.75rem;line-height:1;letter-spacing:-.01em}
.m .sets{grid-column:1/-1;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sts{display:flex;flex-wrap:wrap;gap:5px}
.st{font-size:1rem;font-weight:600;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.08);color:var(--muted)}
.st.sw{font-weight:800;color:var(--ink);background:rgba(255,255,255,.16)}
.m.won .st,.m.lost .st{background:rgba(14,45,74,.08);color:inherit;opacity:.75}
.m.won .st.sw,.m.lost .st.sw{background:rgba(14,45,74,.16);opacity:1}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;line-height:1.25;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:5px 11px;color:var(--muted)}
.key b{color:var(--ink);font-weight:800;white-space:nowrap}
.key::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.key.ka::before{background:var(--a-fill)} .key.kb::before{background:var(--b-fill)}
.key.kw::before{background:var(--win)} .key.kl::before{background:var(--loss)}
button.key.kbtn{font:inherit;font-size:.84rem;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--muted);text-align:left}
button.key.kbtn .kchev{color:var(--acc);font-weight:800;transition:transform .15s}
button.key.kbtn[aria-expanded="true"]{border-color:var(--acc);background:var(--acc-fill);color:#fff}
button.key.kbtn[aria-expanded="true"] b{color:#fff}
button.key.kbtn[aria-expanded="true"] .kchev{color:#fff;transform:rotate(90deg)}
.ligue{gap:8px}
.kf-h{display:flex;flex-direction:column;gap:2px;margin:6px 0 2px}
.matches .who a.pl{color:var(--ink);text-decoration:none;font-weight:700}
.matches.tinted .who a.pl{color:inherit}
#v-joueur .ligue .kf-h{margin-top:8px}
.kf-more{width:100%;margin-top:8px}
/* Navigation rapide (v55) */
.fab{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:8px;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .18s,transform .18s,visibility .18s}
.fab.on{opacity:1;visibility:visible;transform:none}
.fab-b{display:inline-flex;align-items:center;gap:6px;height:46px;min-width:46px;justify-content:center;padding:0 14px;border-radius:999px;border:1px solid var(--sel-line);background:rgba(14,30,58,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font:inherit;font-weight:700;font-size:.88rem;box-shadow:0 10px 24px rgba(0,0,0,.55)}
.fab-b svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fab-b:active{transform:scale(.96)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-in{width:100%;max-width:560px;max-height:72vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-h b{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.sheet-l{overflow-y:auto;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.sec-go{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700}
.sec-go span{color:var(--acc);font-weight:800}
#miniL{gap:2px;padding:0 4px;justify-content:space-between}
#miniL .ml-b{flex:1 1 0;min-width:0;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:9px;background:none;color:var(--muted);font:inherit;font-size:.56rem;font-weight:700;padding:0 1px}
#miniL .ml-b svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#miniL .ml-b span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#miniL .ml-b.on{background:var(--acc-fill);color:#fff}
/* Lisibilité des classements (v54) */
.lbr li.lr{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 8px;border-top:1px solid var(--line);text-align:left;position:relative}
.lbr li.lr .rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;color:var(--ink);background:var(--bg);border:1px solid var(--line);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lbr li.lr .rk.r1{background:var(--gold);color:#2A1E05;border-color:transparent}
.lbr li.lr .rk.r2{background:var(--silver);color:#1B222C;border-color:transparent}
.lbr li.lr .rk.r3{background:var(--bronze);color:#2A1605;border-color:transparent}
.lbr li.lr .nm{min-width:0;display:flex;flex-direction:column;flex-wrap:nowrap;align-items:stretch;text-align:left;gap:3px}
.lbr li.lr .dd{flex-basis:auto}
.lbr li.lr .nl{justify-content:flex-start}
.lbr li.lr .nl{display:flex;align-items:center;gap:6px;min-width:0}
.lbr li.lr .nl a{color:var(--ink);font-weight:700;font-size:.95rem;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lbr li.lr .nl .mks{flex:none;display:inline-flex;gap:3px}
.lbr li.lr .dd{font-size:.74rem;color:var(--muted);line-height:1.3}
.lbr li.lr .meter{display:block;height:2px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:2px}
.lbr li.lr .meter i{display:block;height:100%;background:rgba(76,155,255,.55)}
.lbr li.lr .val{font-weight:800;font-size:1.1rem;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.lbr li.lr.is-sel{margin:3px 0;background:var(--sel);border-radius:12px;border-top-color:transparent;box-shadow:inset 3px 0 0 var(--a)}
.lbr li.lr.is-sel.sB{box-shadow:inset 3px 0 0 var(--b)} .lbr li.lr.is-sel.sJ{box-shadow:inset 3px 0 0 var(--win)}
.lbr li.lr.is-sel+li{border-top-color:transparent}
.lbfull{margin-top:6px}
.pod3 .bar1,.pod3 .bar2,.pod3 .bar3{display:grid;place-items:center}
.pod3 .bar1 b,.pod3 .bar2 b,.pod3 .bar3 b{font-size:1rem;font-weight:800;color:rgba(0,0,0,.55)}
.pod3 .bar3 b{font-size:.85rem}
/* Harmonisation de tous les menus (v52) */
.stile.static{cursor:default}
.cls>.label{color:var(--acc);font-weight:800;letter-spacing:.08em}
#dayPanel .pick>span:first-child{color:var(--acc);font-weight:800;letter-spacing:.08em}
.stile.txt .st-val{font-size:1.15rem;line-height:1.15;overflow-wrap:anywhere}
.stile.tone-a .st-val{color:var(--ink)}
.sec-h .sel-t{display:block}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)),var(--bg);border:1px solid var(--line);border-radius:14px}
.kpi .label{font-size:.66rem;font-weight:800;letter-spacing:.07em}
.ph-card{gap:12px;padding:14px;position:relative;overflow:hidden;border:1px solid var(--sel-line);
  background:radial-gradient(120% 90% at 0% 0%,rgba(61,134,255,.28),rgba(61,134,255,0) 60%),linear-gradient(160deg,#12305E 0%,#0C1E3A 60%,#0A1528 100%)}
.ph-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.ph-top .av{width:52px;height:52px;font-size:1.05rem}
.ph-id{display:flex;flex-direction:column;min-width:0;margin:0}
.ph-fn{font-size:.8rem;font-weight:600;color:#B8C7E0;display:flex;align-items:center;gap:6px}
.ph-ln{font-size:1.35rem;font-weight:800;color:#fff;line-height:1.1;overflow-wrap:anywhere}
.ph-rk{display:flex;flex-direction:column;align-items:flex-end}
.ph-rk b{font-size:1.6rem;font-weight:800;line-height:1;color:#7DB4FF;white-space:nowrap;font-variant-numeric:tabular-nums}
.ph-rk b small{font-size:.5em;color:#9FB2D0;margin-left:1px}
.ph-rk span{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9FB2D0;margin-top:3px}
.ph-stats .hl{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9FB2D0}
.ph-stats .hv.w{color:#7EF0B8} .ph-stats .hv.l{color:#FF9C8F}
/* Tes joueurs dans les classements : cartes par joueur (v50) */
.rc2{gap:12px}
.rc-card{--c:var(--acc);position:relative;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;border:1px solid var(--line);
  background:radial-gradient(120% 80% at 0% 0%,color-mix(in srgb,var(--c) 18%,transparent),transparent 60%),var(--bg);overflow:hidden}
.rc-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.rc-card.selA{--c:var(--a)} .rc-card.selB{--c:var(--b)} .rc-card.selJ{--c:var(--win)}
.rc-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;background:none;border:0;padding:2px 2px 2px 4px;color:inherit;font:inherit;text-align:left;border-radius:12px}
.rc-head.on{background:rgba(255,255,255,.04)}
.rc-head .av{width:42px;height:42px;font-size:.9rem}
.rc-id{display:flex;flex-direction:column;min-width:0}
.rc-fn2{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}

<script>
"use strict";
/* ======================================================================
   H2H Tennis · appli (GitHub Pages). Lit les fichiers produits chaque nuit
   par le collecteur (donnees/), les garde en cache sur l'iPhone et fait
   tous les calculs dans le navigateur.
   ====================================================================== */
const VERSION_APPLI = "0.2.0";
const BASE = "./donnees/";
const CACHE = "h2h-tennis-donnees";
const SURF = {Hard: "Dur", Clay: "Terre", Grass: "Gazon", Carpet: "Moquette"};
const NIV = {G: "Grand Chelem", M: "Masters 1000", A: "ATP 250/500", F: "Finales ATP", N: "NextGen", O: "Jeux olympiques",
  D: "Coupe Davis", C: "Challenger", I15: "ITF M15", I25: "ITF M25", I: "ITF"};
const ORDRE_TOUR = {Q1: 0, Q2: 1, Q3: 2, Q4: 3, Q: 3, "1T": 10, "2T": 11, "3T": 12, "4T": 13, "5T": 14, RR: 15, QF: 20, SF: 21, BR: 22, F: 23};
const NOM_TOUR = {Q1: "Q1", Q2: "Q2", Q3: "Q3", Q: "Qualif.", "1T": "1er tour", "2T": "2e tour", "3T": "3e tour", "4T": "4e tour",
  "5T": "5e tour", RR: "Poule", QF: "Quart", SF: "Demie", BR: "Bronze", F: "Finale"};
const COMPLET = 1, ABANDON = 2, FORFAIT = 4;

const D = {T: [], tIdx: new Map(), M: [], J: new Map(), parJoueur: new Map(), rang: null, photos: {}, stats: new Map(),
  fichiersStats: [], chiffre: false, maj: null, index: null};

const EMBLEME_GRAND = '<svg width="64" height="64" class="emb" viewBox="0 0 64 64" aria-hidden="true" style="filter: drop-shadow(0 3px 8px rgba(31,111,235,.45));"><rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="#0F2A5C"></rect><circle cx="32" cy="24" r="26" fill="#4C9BFF" fill-opacity=".28"></circle><rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="none" stroke="#7DB4FF" stroke-opacity=".45"></rect><g transform="translate(23 30) rotate(-35)"><ellipse cx="0" cy="-6" rx="9" ry="12" fill="none" stroke="#3E8BFF" stroke-width="3.4"></ellipse><path d="M-5-13h10M-6-7h12M-6-1h12M-3-17v22M3-17v22" stroke="#9CC8FF" stroke-width="1" stroke-opacity=".7"></path><rect x="-2" y="6" width="4" height="13" rx="2" fill="#D9A56B"></rect></g><g transform="translate(41 30) rotate(35)"><ellipse cx="0" cy="-6" rx="9" ry="12" fill="none" stroke="#F07A2E" stroke-width="3.4"></ellipse><path d="M-5-13h10M-6-7h12M-6-1h12M-3-17v22M3-17v22" stroke="#FFC48A" stroke-width="1" stroke-opacity=".7"></path><rect x="-2" y="6" width="4" height="13" rx="2" fill="#D9A56B"></rect></g><circle cx="32" cy="47" r="6" fill="#D8F25C"></circle><path d="M27.5 44c3 1.5 3 4.5 0 6M36.5 44c-3 1.5-3 4.5 0 6" fill="none" stroke="#F7F7F2" stroke-width="1"></path></svg>';
/* ---------------------------------------------------------------- outils */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const cle = s => (s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
const dateFr = d => d ? `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}` : "";
const pct = (a, b) => b ? Math.round(100 * a / b) + " %" : "–";
const lsLire = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsEcrire = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); return true; } catch (e) { return false; } };
function initiales(nom) { const m = (nom || "?").split(/\s+/).filter(Boolean); return ((m[0] || "?")[0] + (m.length > 1 ? m[m.length - 1][0] : "")).toUpperCase(); }
function age(n) { if (!n) return null; const a = new Date(), b = new Date(n); let x = a.getFullYear() - b.getFullYear(); if (a < new Date(a.getFullYear(), b.getMonth(), b.getDate())) x--; return x; }
function lundi(d) { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() - ((x.getUTCDay() + 6) % 7)); return x.toISOString().slice(0, 10); }
function plusJours(d, n) { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function inverserScore(s) {
  if (!s) return "";
  return s.split(" ").map(x => {
    let m = x.match(/^(\d+)-(\d+)(\(\d+\))?$/); if (m) return `${m[2]}-${m[1]}${m[3] || ""}`;
    m = x.match(/^\[(\d+)-(\d+)\]$/); if (m) return `[${m[2]}-${m[1]}]`;
    return x;
  }).join(" ");
}

/* ---------------------------------------------------------------- chargement */
function etape(txt, p) { $("#etape").textContent = txt; if (p != null) $("#jauge").style.width = Math.round(100 * p) + "%"; }

async function lireFichier(nom, empreinte) {
  const url = BASE + nom + "?v=" + (empreinte || Date.now());
  let cache = null;
  try { cache = await caches.open(CACHE); const r = await cache.match(url); if (r) return r.json(); } catch (e) { cache = null; }
  const r = await fetch(url, {cache: "no-cache"});
  if (!r.ok) throw new Error(nom + " : HTTP " + r.status);
  if (cache) { try { await cache.put(url, r.clone()); } catch (e) { /* stockage plein : on continue sans cache */ } }
  return r.json();
}

async function nettoyerCache(utiles) {
  try {
    const cache = await caches.open(CACHE);
    for (const req of await cache.keys()) {
      const u = new URL(req.url); const nom = u.pathname.split("/").pop(); const v = u.searchParams.get("v");
      if (!utiles[nom] || utiles[nom].empreinte !== v) await cache.delete(req);
    }
  } catch (e) { /* sans importance */ }
}

/* déchiffrement des compléments (TennisMyLife, Cito) : même format que le collecteur */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let CLE_AES = null;
async function cleAes(code, env) {
  if (CLE_AES && CLE_AES.code === code && CLE_AES.sel === env.sel) return CLE_AES.k;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: b64(env.sel), iterations: env.iterations},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  CLE_AES = {code, sel: env.sel, k};
  return k;
}
async function dechiffrer(env, code) {
  const clair = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(env.iv)}, await cleAes(code, env), b64(env.donnees));
  const flux = new Blob([clair]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(flux).text());
}

function demanderCode(erreur) {
  return new Promise(resolve => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="panel"><div class="sel-t">Code des données complémentaires</div>
      <div class="sous">Scores et statistiques complets (TennisMyLife, Cito) sont chiffrés dans le dépôt public. Saisis le code à 8 chiffres rangé dans GitHub (secret CODE_TML). Il est gardé sur cet appareil.</div>
      ${erreur ? `<div class="note">${esc(erreur)}</div>` : ""}
      <input id="code" inputmode="numeric" autocomplete="off" maxlength="12">
      <div class="btns"><button class="btn plein" id="ok">Valider</button><button class="btn" id="passer">Continuer sans</button></div></div>`;
    document.body.appendChild(m);
    const fin = v => { m.remove(); resolve(v); };
    m.querySelector("#ok").onclick = () => fin(m.querySelector("#code").value.trim());
    m.querySelector("#passer").onclick = () => fin(null);
    setTimeout(() => m.querySelector("#code").focus(), 50);
  });
}

function ajouterTournoi(id, nom, niv, surf, salle, debut, bo, cat) {
  if (D.tIdx.has(id)) return D.tIdx.get(id);
  const i = D.T.length;
  D.T.push({id, nom, niv, surf, salle, debut, bo, cat});
  D.tIdx.set(id, i);
  return i;
}

async function charger() {
  etape("Liste des fichiers…", 0);
  const index = await lireFichier("index.json", null).catch(() => null) || await (await fetch(BASE + "index.json", {cache: "no-store"})).json();
  D.index = index;
  // index.json est relu à chaque ouverture (il change chaque nuit) ; les autres viennent du cache s'ils n'ont pas changé
  const noms = Object.keys(index);
  const simples = noms.filter(n => /^simple-\d{4}(-\d{2})?\.json$/.test(n)).sort();
  const autres = ["joueurs-historique.json", "joueurs-recents.json", "classements-recents.json", "photos.json"].filter(n => index[n]);
  fetch(BASE + "meta.json", {cache: "no-cache"}).then(r => r.json()).then(m => { D.maj = m.genere_le; const p = document.querySelector(".pied b"); if (p) p.textContent = new Date(D.maj).toLocaleString("fr-FR"); }).catch(() => {});
  const chiffres = noms.filter(n => /^(tml|cito)-\d{4}\.json$/.test(n)).sort();
  D.fichiersStats = noms.filter(n => /^stats-simple-/.test(n)).sort();
  const tous = [...autres, ...simples, ...chiffres];
  let fait = 0;
  const lus = {};
  await Promise.all(tous.map(async n => {
    lus[n] = await lireFichier(n, index[n].empreinte);
    fait++; etape(`Données : ${fait} / ${tous.length}`, 0.85 * fait / tous.length);
  }));
  nettoyerCache(index);
  // joueurs
  for (const n of ["joueurs-historique.json", "joueurs-recents.json"]) {
    const j = lus[n]; if (!j) continue;
    for (const [pid, v] of Object.entries(j.joueurs)) D.J.set(pid, {nom: v[0], pays: v[1], main: v[2], taille: v[3], naiss: v[4]});
  }
  // matchs publics
  etape("Assemblage…", 0.88);
  const clesM = new Map();
  for (const n of simples) {
    const f = lus[n];
    const loc = f.tournois.map(t => ajouterTournoi(...t));
    const debutFichier = D.M.length;
    for (const m of f.matchs) {
      const t = loc[m[0]];
      const o = {t, tour: m[1], g: m[2], p: m[3], sc: m[4] || "", d: (m[5] || D.T[t].debut || "").slice(0, 10), dr: m[6], jour: !!m[5]};
      clesM.set(D.T[t].id + "|" + m[2] + "|" + m[3], D.M.length);
      D.M.push(o);
    }
    D.stats.set("stats-" + n, {debut: debutFichier, n: f.matchs.length, charge: false});
  }
  // compléments chiffrés
  if (chiffres.length) {
    let code = lsLire("h2h-code");
    let erreur = null;
    for (let essai = 0; essai < 3; essai++) {
      if (!code) code = await demanderCode(erreur);
      if (!code) break;
      try {
        etape("Déchiffrement…", 0.9);
        const contenus = [];
        for (const n of chiffres) contenus.push(await dechiffrer(lus[n], code));
        lsEcrire("h2h-code", code);
        for (const c of contenus) appliquerComplement(c, clesM);
        D.chiffre = true;
        break;
      } catch (e) {
        code = null; lsEcrire("h2h-code", null); erreur = "Code refusé : les fichiers ne se déchiffrent pas.";
      }
    }
  }
  // tri chronologique et index par joueur
  etape("Index des joueurs…", 0.95);
  for (const [i, m] of D.M.entries()) {
    for (const pid of [m.g, m.p]) { let l = D.parJoueur.get(pid); if (!l) D.parJoueur.set(pid, l = []); l.push(i); }
  }
  const ordre = i => { const m = D.M[i]; return (m.d || "") + String(100 + (ORDRE_TOUR[m.tour] ?? 50)); };
  for (const l of D.parJoueur.values()) l.sort((a, b) => ordre(a) < ordre(b) ? 1 : -1);
  // classement : Cito (officiel complet) sinon dernière semaine connue
  if (!D.rang && lus["classements-recents.json"]) {
    const cr = lus["classements-recents.json"].joueurs;
    let derniere = "";
    for (const v of Object.values(cr)) if (v[0] > derniere) derniere = v[0];
    const liste = Object.entries(cr).filter(([, v]) => v[0] === derniere).map(([pid, v]) => [v[1], pid, v[2]]).sort((a, b) => a[0] - b[0]);
    D.rang = {semaine: derniere, liste, source: "classement d'entrée en tournoi (partiel)"};
  }
  if (D.rang) D.rangPar = new Map(D.rang.liste.map(x => [x[1], x]));
  D.photos = (lus["photos.json"] || {}).joueurs || {};
  etape("Prêt", 1);
}

function appliquerComplement(c, clesM) {
  for (const [pid, v] of Object.entries(c.joueurs || {})) if (!D.J.has(pid)) D.J.set(pid, {nom: v[0], pays: v[1], main: v[2], taille: v[3], naiss: v[4]});
  for (const [tid, s] of Object.entries(c.salles || {})) { const i = D.tIdx.get(tid); if (i != null && D.T[i].salle == null) D.T[i].salle = s; }
  for (const [t, g, p, sc, dr, st, inverse] of c.complements || []) {
    const i = clesM.get(t + "|" + g + "|" + p); if (i == null) continue;
    const m = D.M[i];
    if (inverse === 1) { m.g = p; m.p = g; m.sc = sc; m.dr = dr; if (st) m.st = st; continue; }
    if (sc != null && !(m.dr & COMPLET)) { m.sc = sc; m.dr = dr; }
    if (st && !m.st) m.st = st;
  }
  for (const [tid, tour, g, p, sc, date, dr, st] of c.matchs || []) {
    let t = D.tIdx.get(tid);
    if (t == null) { const x = (c.tournois || {})[tid]; if (!x) continue; t = ajouterTournoi(tid, ...x); }
    const cleM = tid + "|" + g + "|" + p;
    if (clesM.has(cleM)) continue;  // déjà fourni par l'autre complément
    clesM.set(cleM, D.M.length);
    D.M.push({t, tour, g, p, sc: sc || "", d: (date || D.T[t].debut || "").slice(0, 10), dr, st, jour: !!date});
  }
  const co = c.classement_officiel;
  if (co && co.liste && co.liste.length > 50 && (!D.rang || co.semaine >= D.rang.semaine || D.rang.source !== "Cito"))
    D.rang = {semaine: co.semaine, liste: co.liste.map(x => [x[0], x[1], x[2]]), source: "Cito"};
}

/* statistiques de match : chargées à la demande (fichiers lourds) */
async function chargerStats(annees) {
  const voulus = D.fichiersStats.filter(n => !annees || annees.some(a => n.includes("-" + a)));
  for (const n of voulus) {
    const ref = D.stats.get(n);
    if (!ref || ref.charge) continue;
    const f = await lireFichier(n, D.index[n].empreinte);
    f.stats.forEach((s, k) => { const m = D.M[ref.debut + k]; if (s && m && !m.st) m.st = s; });
    ref.charge = true;
  }
}

/* ---------------------------------------------------------------- calculs */
const nomJ = pid => (D.J.get(pid) || {}).nom || pid;
function matchsDe(pid) { return (D.parJoueur.get(pid) || []).map(i => D.M[i]); }
const compte = m => !(m.dr & FORFAIT);
function bilan(liste, pid) { let v = 0, d = 0; for (const m of liste) { if (!compte(m)) continue; m.g === pid ? v++ : d++; } return {v, d}; }
function anneeCourante() { return new Date().getFullYear(); }
function photoDe(pid) {
  const perso = lsLire("h2h-photo-" + pid);
  if (perso) return {url: perso, perso: true};
  const c = D.photos[pid];
  if (c && c[2]) return {url: c[2], auteur: c[3], licence: c[4], lien: c[5], fichier: c[1]};
  return null;
}
function avatar(pid, petit) {
  const ph = photoDe(pid);
  return `<div class="av${petit ? " p" : ""}" ${ph ? `style="background-image:url('${esc(ph.url)}')"` : ""}>${ph ? "" : esc(initiales(nomJ(pid)))}</div>`;
}
function texteRang(pid) {
  const r = D.rangPar && D.rangPar.get(pid);
  if (!r) return "non classé à la dernière semaine";
  return `${r[0]}${r[0] === 1 ? "er" : "e"}${r[2] != null ? " · " + Number(r[2]).toLocaleString("fr-FR") + " pts" : ""}`;
}

/* ======================================================================
   Vues (reprise de l'organisation et du style du ping v55)
   ====================================================================== */
const DEPOT = (() => {
  const h = location.hostname.match(/^([^.]+)\.github\.io$/);
  const r = location.pathname.split("/").filter(Boolean)[0];
  return {proprio: h ? h[1] : "denzelkurt-maker", depot: h && r ? r : "h2h-tennis"};
})();
const SEL = {A: lsLire("h2h-A") || "s206173", B: lsLire("h2h-B") || "s207989", J: lsLire("h2h-J") || "s206173"};
const PREF = {nJ: lsLire("h2h-nJ") || "50", nH: lsLire("h2h-nH") || "tous", surfJ: "tous", circJ: "tous", surfH: "tous", circuit: "C", semaine: null};
const NS = ["10", "20", "50", "100", "tous"];
const scroller = () => $("#scroller");
const memo = (k, v) => { PREF[k] = v; lsEcrire("h2h-" + k, v); };
function choisir(slot, pid) { SEL[slot] = pid; lsEcrire("h2h-" + slot, pid); }

/* ---------------------------------------------------------------- sets et faits de match */
function setsDe(m) {
  if (!(m.dr & COMPLET)) return null;
  const r = [];
  for (const x of (m.sc || "").split(" ")) {
    let k = x.match(/^(\d+)-(\d+)(?:\((\d+)\))?$/);
    if (k) { r.push({g: +k[1], p: +k[2], tb: k[3] != null || (+k[1] + +k[2] === 13)}); continue; }
    k = x.match(/^\[(\d+)-(\d+)\]$/);
    if (k) r.push({g: +k[1], p: +k[2], tb: true, stb: true});
  }
  return r.length ? r : null;
}
const boDe = m => /^Q/.test(m.tour) ? 3 : (D.T[m.t].bo || 3);
function faits(m, pid) {
  const s = setsDe(m), gagne = m.g === pid;
  const f = {gagne, complet: !!s, sets: s};
  if (!s) return f;
  const pour = x => gagne ? x.g > x.p : x.p > x.g;
  f.set1 = pour(s[0]);
  f.decisif = s.length === boDe(m);
  f.tb = s.filter(x => x.tb).length;

    if (m.d < plusJours(sem, -8) || m.d > fin) continue;
    const t = D.T[m.t];
    if (lundi(t.debut) !== sem && !(m.jour && m.d >= sem && m.d <= fin)) continue;
    let x = parT.get(m.t); if (!x) parT.set(m.t, x = {ti: m.t, t, matchs: []}); x.matchs.push(m);

}

      ${tuile("tb", "n", "Jeux décisifs", meneur(tbA, tbT - tbA), tbT + " jeux décisifs", null, "zK").replace('class="stile', 'class="stile txt')}
      ${tuile("fin", "n", "Demi-finales et finales", meneur(finA.v, finA.d), fin.length + " matchs", null, "zK").replace('class="stile', 'class="stile txt')}
    </div>${zoneDetail("zK")}</div>
    <div class="panel"><div class="sec-h"><span class="sel-t">Comparaison</span><span class="sec-sub">Bleu ${esc(nomJ(a))}, orange ${esc(nomJ(b))}</span></div>
      ${barre("tous", "Victoires", ba.v, bb.v)}${barre("sets", "Sets gagnés", setsA, setsB)}${barre("sets", "Jeux gagnés", jeuxA, jeuxB)}
      ${barre("s1", "1er set gagné", s1A, comp.length - s1A)}${barre("tb", "Jeux décisifs gagnés", tbA, tbT - tbA)}
      ${surfs.map(([s, l]) => { const x = bilan(l, a); return barre("s" + s, "Sur " + (SURF[s] || s).toLowerCase(), x.v, x.d); }).join("")}${zoneDetail("zH")}</div>
    <div class="panel"><div class="sec-h"><span class="sel-t">Statistiques dans leurs matchs</span></div><div id="zCmp" class="empty">Chargement…</div></div>
    <div class="panel"><div class="sec-h"><span class="sel-t">Forme générale</span><span class="sec-sub">10 derniers matchs de chacun, tous adversaires</span></div>
      ${[a, b].map((p, i) => `<div class="row"><b style="color:var(--${i ? "b" : "a"});min-width:6rem">${esc(nomJ(p))}</b><span class="chips">${matchsDe(p).filter(compte).slice(0, 10).map(m => `<span class="chip ${m.g === p ? "w" : "l"}">${m.g === p ? "V" : "D"}</span>`).join("")}</span></div>`).join("")}</div>
    <div class="panel"><div class="sec-h"><span class="sel-t">Rencontres</span><span class="sec-sub">Vu de ${esc(nomJ(a))}</span></div><div class="matches tinted">${L.map(m => carte(m, a, true)).join("")}</div></div>`
    : '<div class="panel empty">Jamais affrontés dans la base (avec ces filtres)</div>'}`;
  v.querySelectorAll("[data-slot]").forEach(x => x.onclick = () => ouvrirChoix(x.dataset.slot, vueH2H));
  $("#swap").onclick = () => { const t = SEL.A; choisir("A", SEL.B); choisir("B", t); vueH2H(); };
  v.querySelectorAll("[data-n]").forEach(x => x.onclick = () => { memo("nH", x.dataset.n); vueH2H(); });
  v.querySelectorAll("[data-surfh]").forEach(x => x.onclick = () => { PREF.surfH = x.dataset.surfh; vueH2H(); });
  brancherTuiles(v);
  if (!L.length) return;
  try {
    await chargerStats([...new Set(L.map(m => m.d.slice(0, 4)))]);
    const z = $("#zCmp"); if (!z || SEL.A !== a || SEL.B !== b) return;
    const sa = statsService(L, a), sb = statsService(L, b);
    const l = (k, x, y) => `<div class="stat"><span class="v a">${x}</span><span class="mid"><span class="label ctr">${k}</span></span><span class="v b">${y}</span></div>`;
    z.outerHTML = sa.n ? `<div>${l("Aces par match", (sa.ace / sa.n).toFixed(1), (sb.ace / sb.n).toFixed(1))}${l("1re balle", pctTxt(sa.in1, sa.svpt), pctTxt(sb.in1, sb.svpt))}
      ${l("Points gagnés 1re", pctTxt(sa.w1, sa.in1), pctTxt(sb.w1, sb.in1))}${l("Points gagnés 2e", pctTxt(sa.w2, sa.svpt - sa.in1), pctTxt(sb.w2, sb.svpt - sb.in1))}
      ${l("Balles de break sauvées", pctTxt(sa.bps, sa.bpf), pctTxt(sb.bps, sb.bpf))}${l("Breaks réussis", pctTxt(sa.bpc, sa.bpo), pctTxt(sb.bpc, sb.bpo))}
      <div class="small muted">Sur ${sa.n} matchs avec statistiques</div></div>` : '<div class="empty">Pas de statistiques pour leurs matchs</div>';
  } catch (e) { const z = $("#zCmp"); if (z) z.innerHTML = `<div class="note">${esc(e.message)}</div>`; }
}

/* ---------------------------------------------------------------- Mise à jour (collecte lancée sur GitHub) */
const API = "https://api.github.com/repos/" + DEPOT.proprio + "/" + DEPOT.depot;
let SUIVI = null;
function afficherEtatMaj(txt) {
  const e = $("#majEtat"); if (!e) return;
  if (txt != null) lsEcrire("h2h-majEtat", txt);
  e.innerHTML = esc(lsLire("h2h-majEtat") || "");
}
async function appelGitHub(chemin, opts) {
  const jeton = lsLire("h2h-jeton");
  const r = await fetch(API + chemin, Object.assign({headers: {Authorization: "Bearer " + jeton, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}}, opts || {}));
  if (r.status === 204) return null;
  if (!r.ok) throw new Error("GitHub HTTP " + r.status + (r.status === 401 || r.status === 403 ? " (jeton refusé ou sans droit Actions)" : ""));
  return r.json();
}
async function lancerMiseAJour() {
  if (!lsLire("h2h-jeton")) { alert("Il faut d'abord enregistrer un jeton GitHub dans Réglages."); aller("reglages"); return; }
  const debut = new Date().toISOString();
  const metaAvant = D.maj;
  try {
    await appelGitHub("/actions/workflows/collecte.yml/dispatches", {method: "POST", body: JSON.stringify({ref: "main"})});
  } catch (e) { afficherEtatMaj("Échec du lancement : " + e.message); return; }
  afficherEtatMaj("Collecte lancée à " + new Date().toLocaleTimeString("fr-FR").slice(0, 5) + ", suivi en cours…");
  clearInterval(SUIVI);
  let tours = 0;
  SUIVI = setInterval(async () => {
    tours++;
    try {
      const runs = await appelGitHub("/actions/workflows/collecte.yml/runs?event=workflow_dispatch&per_page=1");
      const run = runs.workflow_runs && runs.workflow_runs[0];
      if (run && run.created_at >= debut.slice(0, 16) && run.status !== "completed") afficherEtatMaj(`Collecte en cours (${run.status === "queued" ? "en attente" : "démarrée"})…`);
      if (run && run.status === "completed" && run.conclusion !== "success") { afficherEtatMaj("La collecte a échoué : voir l'appli GitHub, onglet Actions."); clearInterval(SUIVI); return; }
      const meta = await (await fetch(BASE + "meta.json?v=" + Date.now(), {cache: "no-store"})).json();
      if (meta.genere_le && meta.genere_le !== metaAvant && meta.genere_le > debut.slice(0, 19)) {
        afficherEtatMaj("Nouvelles données en ligne : rechargement…"); clearInterval(SUIVI); setTimeout(() => location.reload(), 800); return;
      }
      if (run && run.status === "completed") afficherEtatMaj("Collecte terminée, publication des données en cours…");
    } catch (e) { afficherEtatMaj("Suivi interrompu : " + e.message); }
    if (tours > 60) { clearInterval(SUIVI); afficherEtatMaj("Toujours rien après 30 min : vérifie l'onglet Actions de GitHub."); }
  }, 30000);
}

        <div class="kpi"><span class="label">Photos</span><span class="n">${Object.values(D.photos).filter(p => p[2]).length}</span></div><div class="kpi"><span class="label">Rangs</span><span class="n">${D.rang ? D.rang.liste.length : 0}</span></div></div>

    <div class="panel"><div class="sec-h"><span class="sel-t">Sources</span></div><div class="small muted">Archive Jeff Sackmann (CC BY-NC-SA), Valuebetennis (CC BY), Kaggle dissfya (CC0), Wikipédia (CC BY-SA), TennisMyLife et Cito API (usage personnel, chiffrés), Wikidata (CC0), photos Wikimedia Commons (licence de chaque photo). Usage personnel, non commercial.</div></div>
    <p class="appver small muted">Version de l'appli : ${VERSION_APPLI}</p>`;
  $("#code").onclick = () => { lsEcrire("h2h-code", null); location.reload(); };
  $("#cache").onclick = async () => { try { await caches.delete(CACHE); } catch (e) { /* rien */ } location.reload(); };

    const j = $("#jeton").value.trim(); if (j) lsEcrire("h2h-jeton", j);
    try { const w = await appelGitHub("/actions/workflows/collecte.yml"); $("#jetonEtat").textContent = "Jeton valide : collecte « " + w.name + " » accessible."; }
    catch (e) { $("#jetonEtat").textContent = e.message; }

    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], {type: "application/json"}));

/* ---------------------------------------------------------------- démarrage */
function chercher(txt) {
  const mots = cle(txt).split(" ").filter(Boolean);
  if (!mots.length) return [];
  const res = [];
  for (const [pid, j] of D.J) { const k = cle(j.nom); if (mots.every(m => k.includes(m))) res.push([pid, (D.parJoueur.get(pid) || []).length]); }
  return res.sort((a, b) => b[1] - a[1]).slice(0, 40).map(x => x[0]);
}
scroller().addEventListener("scroll", () => $("#fab").classList.toggle("on", scroller().scrollTop > 700), {passive: true});
$("#haut").onclick = () => scroller().scrollTo({top: 0, behavior: "smooth"});
charger().then(() => { $("#charge").remove(); rendre(); }).catch(e => {
  $("#etape").innerHTML = `<span class="l">Chargement impossible : ${esc(e.message)}</span><br><button onclick="location.reload()">Réessayer</button>`;
  console.error(e);
});
