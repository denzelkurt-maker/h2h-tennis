name: Actualités tennis

# Titres des flux RSS publics (ESPN, Tennis Majors, Ubitennis), toutes les 2 heures, ou à la main.
on:
  schedule:
    - cron: "47 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actus
  cancel-in-progress: true

jobs:
  actus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Lire les flux
        run: python3 collecteur.py --actus-seulement
      - name: Enregistrer
        run: |
          git config user.name "actus-h2h"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/actus.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Actualités"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 15; done
