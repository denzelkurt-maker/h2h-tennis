name: Test sportsapi365

# Essai à la main : 2 requêtes au plus (quota gratuit : 150 par mois). Aucune donnée brute n'est publiée :
# le compte rendu rapport/test-sa365.md ne contient que des codes HTTP, des noms de champs et des niveaux de tournoi.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Deux requêtes
        env:
          SA365_KEY: ${{ secrets.SPORTSAPI365_KEY }}
        run: python3 outils/test_sa365.py
      - name: Enregistrer le compte rendu
        run: |
          git config user.name "test-sa365"
          git config user.email "actions@users.noreply.github.com"
          git add rapport/test-sa365.md
          git diff --cached --quiet || git commit -q -m "Test sportsapi365"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
